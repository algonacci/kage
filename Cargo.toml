[package]
name = "kage"
version = "0.1.0"
edition = "2024"
description = "Engineering workflow orchestrator for AI coding agents"
license = "MIT"
repository = "https://github.com/algonacci/kage"
keywords = ["ai", "cli", "orchestration", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
# rustls rather than the platform TLS stack: CI builds on Linux, macOS and Windows, and native-tls
# would make the Linux job depend on OpenSSL development headers being present.
reqwest = { version = "0.13.2", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
] }
tokio = { version = "1.53.1", features = [
 "fs",
 "io-util",
 "macros",
 "process",
 "rt-multi-thread",
 "time",
] }
futures = "0.3.32"

[profile.release]
lto = "thin"
strip = true
