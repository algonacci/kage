name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Kage spawns processes, resolves PATH, and drives git worktrees — all three behave differently
    # per platform, so the suite runs on all three rather than on one and hoping.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The worktree tests create commits; git refuses without an identity configured.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@kage.local"
          git config --global user.name "Kage CI"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
